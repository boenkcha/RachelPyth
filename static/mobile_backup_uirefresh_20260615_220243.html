<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e74c8b">
<title>Rachel Clinic — Foto Pasien</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --pink:#e74c8b;--pink2:#f472b6;--pink-dim:rgba(231,76,139,.1);
  --teal:#14b8a6;--gold:#f59e0b;
  --bg:#f1f5f9;--card:#fff;--border:#e2e8f0;
  --text:#1e293b;--text2:#64748b;--text3:#94a3b8;
  --danger:#ef4444;--success:#22c55e;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);}

/* ── APP SHELL ── */
#app{position:fixed;inset:0;overflow:hidden;}
.screen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);will-change:transform;}
.screen.active{transform:translateX(0);}
.screen.prev{transform:translateX(-30%);}

/* ── HEADER ── */
.hdr{padding:calc(var(--safe-top) + 12px) 16px 12px;background:var(--pink);color:#fff;
  display:flex;align-items:center;gap:12px;flex-shrink:0;
  box-shadow:0 2px 8px rgba(231,76,139,.3);}
.hdr-back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);
  border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hdr-title{flex:1;font-size:16px;font-weight:700;letter-spacing:-.3px;}
.hdr-sub{font-size:11px;opacity:.8;margin-top:1px;}
.hdr-action{padding:7px 14px;border-radius:20px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);
  color:#fff;font-size:12px;font-weight:600;cursor:pointer;}

/* ── SCROLL BODY ── */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}

/* ── SEARCH SCREEN ── */
.search-wrap{padding:16px;}
.search-box{position:relative;}
.search-box input{width:100%;padding:14px 16px 14px 44px;border:2px solid var(--border);
  border-radius:16px;background:var(--card);font-size:15px;color:var(--text);outline:none;
  transition:.2s;}
.search-box input:focus{border-color:var(--pink);}
.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--text3);}
.section-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;
  padding:16px 16px 8px;}
.patient-list{padding:0 16px 16px;}
.patient-item{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:.15s;active:scale(.98);}
.patient-item:active{transform:scale(.98);background:#f8fafc;}
.patient-avatar{width:44px;height:44px;border-radius:50%;background:var(--pink-dim);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;
  color:var(--pink);flex-shrink:0;}
.patient-name{font-weight:600;font-size:14px;color:var(--text);}
.patient-meta{font-size:11px;color:var(--text3);margin-top:2px;}
.patient-arrow{font-size:16px;color:var(--text3);margin-left:auto;}
.patient-foto-count{font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;
  background:var(--pink-dim);color:var(--pink);}

/* ── PATIENT SCREEN ── */
.tab-bar{display:flex;background:var(--card);border-bottom:2px solid var(--border);flex-shrink:0;}
.tab{flex:1;padding:12px 8px;text-align:center;font-size:11px;font-weight:700;
  color:var(--text3);border:none;background:none;cursor:pointer;letter-spacing:.3px;
  border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s;}
.tab.active{color:var(--pink);border-bottom-color:var(--pink);}
.foto-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;}
.foto-card{background:var(--card);border-radius:14px;overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer;transition:.15s;}
.foto-card:active{transform:scale(.97);}
.foto-thumb{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;}
.foto-thumb-placeholder{width:100%;aspect-ratio:3/4;background:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:32px;}
.foto-info{padding:9px 10px;}
.foto-tipe{display:inline-block;font-size:9px;font-weight:700;padding:2px 8px;border-radius:8px;margin-bottom:4px;}
.tipe-sebelum{background:rgba(245,158,11,.15);color:#d97706;}
.tipe-sesudah{background:rgba(34,197,94,.15);color:#16a34a;}
.tipe-progress{background:rgba(99,102,241,.15);color:#4f46e5;}
.foto-date{font-size:10px;color:var(--text3);}
.foto-area{font-size:11px;font-weight:500;color:var(--text2);margin-top:1px;}

/* ── FAB ── */
.fab{position:absolute;bottom:calc(24px + var(--safe-bot));right:20px;width:58px;height:58px;
  border-radius:50%;background:var(--pink);color:#fff;font-size:26px;border:none;
  box-shadow:0 4px 16px rgba(231,76,139,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.15s;z-index:10;}
.fab:active{transform:scale(.93);}
.empty-state{text-align:center;padding:50px 24px;color:var(--text3);}
.empty-state .icon{font-size:52px;margin-bottom:14px;}
.empty-state .msg{font-size:14px;line-height:1.6;}

/* ── ADD SCREEN ── */
.form-section{padding:16px;}
.form-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.chip{padding:8px 16px;border-radius:20px;border:2px solid var(--border);background:var(--card);
  font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:.15s;}
.chip.sel{border-color:var(--pink);background:var(--pink-dim);color:var(--pink);}
.chip.sel-teal{border-color:var(--teal);background:rgba(20,184,166,.1);color:var(--teal);}
.chip:active{transform:scale(.96);}

/* Camera / Preview */
.camera-wrap{position:relative;background:#000;border-radius:18px;overflow:hidden;margin-bottom:16px;}
#camera-video{width:100%;display:block;max-height:55vw;object-fit:cover;}
#preview-img{width:100%;display:block;max-height:65vw;object-fit:contain;background:#111;}
.camera-overlay{position:absolute;bottom:0;left:0;right:0;padding:12px;
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(transparent,rgba(0,0,0,.5));}
.cam-btn{width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:20px;transition:.15s;}
.cam-btn:active{transform:scale(.9);}
.cam-btn-capture{width:66px;height:66px;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.4);}
.cam-btn-flip{background:rgba(255,255,255,.2);color:#fff;}
.cam-btn-gallery{background:rgba(255,255,255,.2);color:#fff;}
.cam-placeholder{padding:48px 24px;text-align:center;color:rgba(255,255,255,.5);font-size:14px;}
.cam-placeholder .icon{font-size:44px;margin-bottom:8px;}

textarea.form-input{width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;
  background:var(--card);font-size:14px;color:var(--text);resize:none;outline:none;
  font-family:inherit;transition:.2s;}
textarea.form-input:focus{border-color:var(--pink);}
input.form-input{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;
  background:var(--card);font-size:14px;color:var(--text);outline:none;transition:.2s;}
input.form-input:focus{border-color:var(--pink);}

.btn-full{width:100%;padding:16px;border-radius:16px;border:none;font-size:15px;font-weight:700;
  cursor:pointer;transition:.15s;letter-spacing:.3px;}
.btn-full:active{transform:scale(.98);}
.btn-pink{background:var(--pink);color:#fff;box-shadow:0 4px 12px rgba(231,76,139,.35);}
.btn-outline{background:var(--card);color:var(--text2);border:2px solid var(--border) !important;border:none;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-row{display:flex;gap:10px;padding:0 16px 16px;}

/* ── DETAIL SCREEN ── */
.detail-img-wrap{background:#000;flex-shrink:0;}
#detail-img{width:100%;display:block;max-height:65vw;object-fit:contain;}
.detail-info{padding:16px;background:var(--card);border-top:1px solid var(--border);}
.detail-badge-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.detail-badge{font-size:11px;font-weight:700;padding:4px 12px;border-radius:10px;}
.detail-keterangan{font-size:14px;color:var(--text2);margin-bottom:10px;line-height:1.6;}
.detail-meta{font-size:11px;color:var(--text3);}

/* ── COMPARE SCREEN ── */
.compare-labels{display:flex;background:#1e293b;flex-shrink:0;}
.compare-label{flex:1;text-align:center;padding:10px;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;}
.compare-label.before{color:#f59e0b;}
.compare-label.after{color:#22c55e;}
.compare-outer{position:relative;flex:1;overflow:hidden;background:#000;touch-action:none;}
.compare-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;}
.compare-clip{position:absolute;top:0;left:0;height:100%;overflow:hidden;}
.compare-clip img{display:block;height:100%;object-fit:contain;}
.compare-handle-line{position:absolute;top:0;width:3px;background:rgba(255,255,255,.9);
  height:100%;transform:translateX(-50%);pointer-events:none;
  box-shadow:0 0 8px rgba(0,0,0,.5);}
.compare-handle-circle{position:absolute;top:50%;width:48px;height:48px;background:#fff;
  border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;box-shadow:0 2px 12px rgba(0,0,0,.4);cursor:ew-resize;user-select:none;}
.compare-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:6px 14px;border-radius:20px;
  pointer-events:none;white-space:nowrap;}
.compare-dates{display:flex;background:#0f172a;flex-shrink:0;}
.compare-date{flex:1;text-align:center;padding:8px;font-size:10px;color:rgba(255,255,255,.5);}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;
  display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:.25s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-sheet{width:100%;background:var(--card);border-radius:24px 24px 0 0;
  padding:16px;padding-bottom:calc(16px + var(--safe-bot));
  transform:translateY(100%);transition:.25s;}
.modal-overlay.open .modal-sheet{transform:translateY(0);}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;
  margin:0 auto 20px;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;text-align:center;}

/* ── TOAST ── */
#toast{position:fixed;bottom:calc(24px + var(--safe-bot));left:50%;transform:translateX(-50%) translateY(20px);
  background:#1e293b;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;
  opacity:0;transition:.3s;z-index:200;white-space:nowrap;pointer-events:none;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── LOGIN OVERLAY ── */
#login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#fbf2f7 0%,#fff 100%);
  z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;
  padding-top:calc(var(--safe-top) + 32px);padding-bottom:calc(var(--safe-bot) + 32px);}
#login-overlay.hidden{display:none;}
.login-brand{font-size:38px;font-weight:300;letter-spacing:6px;color:var(--pink);margin-bottom:4px;font-family:-apple-system,sans-serif;}
.login-sub{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--text3);margin-bottom:48px;}
.login-field{width:100%;max-width:320px;margin-bottom:14px;}
.login-field label{display:block;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.login-field input{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:14px;
  background:#fff;font-size:15px;color:var(--text);outline:none;transition:.2s;}
.login-field input:focus{border-color:var(--pink);}
.login-btn{width:100%;max-width:320px;padding:16px;border-radius:16px;border:none;background:var(--pink);
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(231,76,139,.35);
  letter-spacing:.3px;transition:.15s;margin-top:4px;}
.login-btn:active{transform:scale(.98);}
.login-err{color:var(--danger);font-size:12px;margin-top:12px;text-align:center;min-height:16px;max-width:320px;}

/* ── LOADING ── */
.spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* date group */
.date-group-label{padding:12px 16px 4px;font-size:11px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.5px;}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;
  display:flex;background:var(--card);border-top:1px solid var(--border);
  padding-bottom:var(--safe-bot);box-shadow:0 -2px 10px rgba(0,0,0,.06);}
.bn-item{flex:1;border:none;background:none;padding:9px 4px 7px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--text3);font-size:10px;font-weight:700;letter-spacing:.2px;transition:.15s;}
.bn-item .bn-ic{font-size:21px;line-height:1;}
.bn-item.active{color:var(--pink);}
.bn-item:active{transform:scale(.94);}

/* ── KOMISI ── */
.komisi-filter{padding:16px;}
.komisi-summary{margin:4px 16px 8px;background:linear-gradient(135deg,var(--pink),var(--pink2));
  color:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 4px 16px rgba(231,76,139,.3);}
.ks-label{font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.6px;font-weight:700;}
.ks-value{font-size:27px;font-weight:800;margin-top:4px;letter-spacing:-.5px;}
.ks-sub{font-size:11px;opacity:.85;margin-top:3px;}
.komisi-day{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px;
  font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;}
.komisi-item{display:flex;align-items:center;gap:10px;margin:0 16px 8px;background:var(--card);
  border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.ki-jasa{font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ki-meta{font-size:11px;color:var(--text3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ki-komisi{font-size:14px;font-weight:700;color:var(--pink);white-space:nowrap;flex-shrink:0;}
</style>
</head>
<body>
<!-- LOGIN OVERLAY -->
<div id="login-overlay">
  <div class="login-brand">RACHEL</div>
  <div class="login-sub">Foto Pasien · Mobile</div>
  <div class="login-field">
    <label>Username</label>
    <input id="l-user" type="text" autocomplete="username" autocapitalize="none" placeholder="username" inputmode="text">
  </div>
  <div class="login-field">
    <label>Password</label>
    <input id="l-pass" type="password" autocomplete="current-password" placeholder="••••••••">
  </div>
  <button class="login-btn" onclick="doMobileLogin()">Masuk</button>
  <div class="login-err" id="login-err"></div>
  <div style="margin-top:36px;font-size:10px;color:var(--text3);letter-spacing:1.5px;text-align:center">copyright by UCHAHUNT &mdash; 2026</div>
</div>

<div id="app">
  <div id="scr-search" class="screen active"></div>
  <div id="scr-komisi" class="screen"></div>
  <div id="scr-patient" class="screen"></div>
  <div id="scr-add" class="screen"></div>
  <div id="scr-detail" class="screen"></div>
  <div id="scr-compare" class="screen"></div>
</div>
<!-- BOTTOM NAV (perawat/beautician) -->
<div class="bottom-nav" id="bottom-nav" style="display:none;">
  <button class="bn-item" data-scr="scr-search" onclick="navHome('scr-search')">
    <span class="bn-ic">📸</span>Foto Pasien</button>
  <button class="bn-item" data-scr="scr-komisi" onclick="navHome('scr-komisi')">
    <span class="bn-ic">💰</span>Komisi</button>
</div>
<div class="modal-overlay" id="modal-delete">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Hapus Foto?</div>
    <p style="text-align:center;font-size:13px;color:var(--text2);margin-bottom:20px;">
      Foto ini akan dihapus permanen dan tidak bisa dikembalikan.
    </p>
    <button class="btn-full btn-danger" id="modal-delete-confirm">Hapus</button>
    <button class="btn-full btn-outline" style="margin-top:10px;" onclick="closeModal()">Batal</button>
  </div>
</div>
<div id="toast"></div>

<script>
// ── STATE ─────────────────────────────────────────────────
const state = {
  user: null,          // logged-in user
  token: null,         // session token
  patient: null,       // {kd_pasien, nm_pasien, ...}
  photos: [],          // all photos for current patient
  activeTab: 'semua',
  stream: null,        // MediaStream
  facingMode: 'environment',
  capturedDataUrl: null,
  detailPhoto: null,
  comparePhotos: { before: null, after: null },
  pendingDeleteId: null,
};

// ── AUTH PERSISTENCE ──────────────────────────────────────
const STORAGE_KEY = 'rc_mobile_session';
function saveSession(user, token) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({user, token}));
}
function loadSession() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch { return null; }
}
function clearSession() { localStorage.removeItem(STORAGE_KEY); }

// ── API ───────────────────────────────────────────────────
const BASE = window.location.origin;
async function api(path, opts={}) {
  const hdrs = { 'Content-Type': 'application/json' };
  if (state.token) hdrs['X-Token'] = state.token;
  const res = await fetch(BASE + path, {
    headers: hdrs,
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  return res.json();
}

// ── DOM HELPERS ───────────────────────────────────────────
const $ = id => document.getElementById(id);
// Tanggal LOKAL sistem → 'YYYY-MM-DD' (hindari toISOString/UTC).
function localDate(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayLocal() { return localDate(); }
function show(screenId) {
  const prev = document.querySelector('.screen.active');
  const next = $(screenId);
  if (!next || next === prev) return;
  prev?.classList.remove('active');
  prev?.classList.add('prev');
  next.classList.add('active');
  setTimeout(() => prev?.classList.remove('prev'), 300);
  updateBottomNav();
}
function goBack(screenId) {
  const prev = document.querySelector('.screen.active');
  const next = $(screenId);
  if (!next || next === prev) return;
  // Letakkan layar tujuan sedikit di kiri, lalu geser masuk SAMBIL menandai active
  // (tanpa active, layar akan balik ke posisi default di luar layar → blank putih)
  next.classList.remove('prev');
  next.style.transition = 'none';
  next.style.transform  = 'translateX(-30%)';
  next.classList.add('active');
  void next.offsetWidth;                       // paksa reflow agar transisi berikutnya beranimasi
  next.style.transition = 'transform .28s cubic-bezier(.4,0,.2,1)';
  next.style.transform  = 'translateX(0)';
  if (prev) { prev.classList.remove('active','prev'); }  // layar lama geser keluar ke kanan
  setTimeout(() => { next.style.transition = ''; next.style.transform = ''; }, 300);
  updateBottomNav();
}

function toast(msg, dur=2500) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}
function closeModal() {
  document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open'));
}

// ── SCREEN: SEARCH ────────────────────────────────────────
async function renderSearch(query='') {
  const s = $('scr-search');
  const deep = window.location.pathname.match(/\/mobile\/foto\/(.+)/);
  if (deep) {
    const kd = decodeURIComponent(deep[1]);
    const p = await api(`/api/pasien/${kd}`);
    if (p) { openPatient(p); return; }
  }

  // Shell (termasuk input) dirender SEKALI. Saat mengetik hanya daftar hasil yang
  // diperbarui — input TIDAK disentuh, supaya caret tidak lompat ke awal teks.
  s.innerHTML = `
  <div class="hdr">
    <div style="flex:1;">
      <div class="hdr-title">📸 Foto Pasien</div>
      <div class="hdr-sub">${state.user?.nama || 'Rachel Clinic'}</div>
    </div>
    <button class="hdr-action" onclick="doMobileLogout()" style="font-size:11px;opacity:.85">Keluar</button>
  </div>
  <div class="body" style="padding-bottom:calc(76px + var(--safe-bot));">
    <div class="search-wrap">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input id="srch" type="search" placeholder="Cari nama atau kode pasien..."
          value="${query}" autocomplete="off" inputmode="search">
      </div>
    </div>
    <div class="section-label" id="search-label">${query ? 'Hasil Pencarian' : 'Daftar Pasien'}</div>
    <div class="patient-list" id="patient-list">
      <div class="empty-state" style="padding-top:24px;"><div class="icon">⏳</div><div class="msg">Memuat...</div></div>
    </div>
  </div>`;

  const inp = s.querySelector('#srch');
  inp.focus();
  let debounce;
  inp.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => updateSearchResults(inp.value.trim()), 300);
  });
  inp.addEventListener('keydown', e => { if (e.key==='Enter') inp.blur(); });
  updateBottomNav();
  updateSearchResults(query);
}

// Update HANYA daftar hasil + label. Input pencarian tidak dirender ulang.
let _searchSeq = 0;
async function updateSearchResults(query) {
  const seq = ++_searchSeq;
  const patients = await api(`/api/pasien?q=${encodeURIComponent(query)}`);
  if (seq !== _searchSeq) return;   // abaikan hasil fetch yang sudah usang
  const label = $('search-label');
  if (label) label.textContent = query ? 'Hasil Pencarian' : 'Daftar Pasien';
  const list = $('patient-list');
  if (list) list.innerHTML = renderPatientItems(patients || []);
}

function renderPatientItems(patients) {
  if (!patients.length) return `<div class="empty-state"><div class="icon">🔍</div><div class="msg">Pasien tidak ditemukan</div></div>`;
  return patients.map(p => {
    const initials = (p.nm_pasien||'?').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
    return `<div class="patient-item" onclick="openPatient(${JSON.stringify(p).replace(/"/g,'&quot;')})">
      <div class="patient-avatar">${initials}</div>
      <div style="flex:1;min-width:0;">
        <div class="patient-name">${p.nm_pasien}</div>
        <div class="patient-meta">${p.kd_pasien}${p.telp?' · '+p.telp:''}</div>
      </div>
      <span class="patient-arrow">›</span>
    </div>`;
  }).join('');
}

// ── SCREEN: PATIENT ───────────────────────────────────────
async function openPatient(p) {
  state.patient = p;
  state.activeTab = 'semua';
  await loadAndRenderPatient();
  show('scr-patient');
}

async function loadAndRenderPatient() {
  const p = state.patient;
  state.photos = await api(`/api/foto-pasien/${p.kd_pasien}`) || [];
  renderPatientScreen();
}

function renderPatientScreen() {
  const p = state.patient;
  const photos = getFilteredPhotos();
  const s = $('scr-patient');

  const tabs = ['semua','sebelum','sesudah','progress'];
  const tabHtml = tabs.map(t => `
    <button class="tab ${state.activeTab===t?'active':''}" onclick="switchTab('${t}')">
      ${t==='semua'?'Semua':t.charAt(0).toUpperCase()+t.slice(1)}
    </button>`).join('');

  // Group photos by date
  const grouped = {};
  photos.forEach(f => {
    const d = f.tanggal || 'Unknown';
    if (!grouped[d]) grouped[d] = [];
    grouped[d].push(f);
  });
  const dates = Object.keys(grouped).sort().reverse();

  let gridHtml = '';
  if (!dates.length) {
    gridHtml = `<div class="empty-state" style="padding-top:60px;">
      <div class="icon">📷</div>
      <div class="msg">Belum ada foto${state.activeTab!=='semua'?' '+state.activeTab:''}.<br>Tap + untuk menambahkan.</div>
    </div>`;
  } else {
    dates.forEach(d => {
      gridHtml += `<div class="date-group-label">${formatDate(d)}</div><div class="foto-grid">`;
      grouped[d].forEach(f => {
        const tClass = `tipe-${f.tipe}`;
        gridHtml += `<div class="foto-card" onclick="openDetail(${f.id})" ${canDeletePhoto(f)?`oncontextmenu="confirmDelete(${f.id});return false;"`:''}>

          <img class="foto-thumb" src="${f.url}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
          <div class="foto-thumb-placeholder" style="display:none;">📷</div>
          <div class="foto-info">
            <span class="foto-tipe ${tClass}">${f.tipe}</span>
            <div class="foto-area">${f.area || 'Umum'}</div>
            <div class="foto-date">${formatDate(f.tanggal)}</div>
          </div>
        </div>`;
      });
      gridHtml += `</div>`;
    });
  }

  // Check if there's a before+after pair (for compare button)
  const hasBefore = state.photos.some(f=>f.tipe==='sebelum');
  const hasAfter  = state.photos.some(f=>f.tipe==='sesudah');

  s.innerHTML = `
  <div class="hdr">
    <button class="hdr-back" onclick="backToSearch()">‹</button>
    <div style="flex:1;min-width:0;">
      <div class="hdr-title" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.nm_pasien}</div>
      <div class="hdr-sub">${p.kd_pasien} · ${state.photos.length} foto</div>
    </div>
    ${hasBefore && hasAfter ? `<button class="hdr-action" onclick="openCompare()">Compare</button>` : ''}
  </div>
  <div class="tab-bar">${tabHtml}</div>
  <div class="body" style="padding-bottom:calc(90px + var(--safe-bot));">${gridHtml}</div>
  <button class="fab" onclick="openAdd()">+</button>`;
}

function switchTab(t) {
  state.activeTab = t;
  renderPatientScreen();
}
function getFilteredPhotos() {
  if (state.activeTab === 'semua') return state.photos;
  return state.photos.filter(f => f.tipe === state.activeTab);
}
function backToSearch() {
  stopCamera();
  goBack('scr-search');
}

function selChip(el, groupId, variant='') {
  document.querySelectorAll(`#${groupId} .chip`).forEach(c => {
    c.classList.remove('sel','sel-teal');
  });
  el.classList.add(variant === 'teal' ? 'sel-teal' : 'sel');
}
function getChipVal(groupId) {
  return document.querySelector(`#${groupId} .chip.sel, #${groupId} .chip.sel-teal`)?.dataset.val || '';
}

async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) return;
  try {
    const constraints = { video: { facingMode: state.facingMode, width:{ideal:1280}, height:{ideal:960} } };
    state.stream = await navigator.mediaDevices.getUserMedia(constraints);
    const v = $('camera-video');
    v.srcObject = state.stream;
    v.style.display = 'block';
    $('cam-placeholder').style.display = 'none';
  } catch(e) {
    // Camera permission denied — show native file input fallback
    $('cam-placeholder').innerHTML = `<div class="icon">📷</div><div>Ketuk 📷 untuk membuka kamera perangkat</div>`;
  }
}

function stopCamera() {
  state.stream?.getTracks().forEach(t => t.stop());
  state.stream = null;
}

function captureOrActivate() {
  if (state.stream) {
    // Capture from video
    const v = $('camera-video');
    const c = $('cam-canvas');
    c.width = v.videoWidth || 1280;
    c.height = v.videoHeight || 960;
    c.getContext('2d').drawImage(v, 0, 0);
    state.capturedDataUrl = c.toDataURL('image/jpeg', 0.92);
    showPreview(state.capturedDataUrl);
  } else {
    $('cam-inp').click();
  }
}

function pickGallery() {
  $('file-inp').click();
}

function flipCamera() {
  stopCamera();
  state.facingMode = state.facingMode === 'environment' ? 'user' : 'environment';
  const v = $('camera-video');
  v.style.transform = state.facingMode === 'user' ? 'scaleX(-1)' : '';
  startCamera();
}

function fileSelected(inp) {
  const file = inp.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    state.capturedDataUrl = e.target.result;
    showPreview(state.capturedDataUrl);
  };
  reader.readAsDataURL(file);
  inp.value = '';
}

function showPreview(dataUrl) {
  stopCamera();
  const v = $('camera-video');
  const img = $('preview-img');
  const ph  = $('cam-placeholder');
  if (v) v.style.display = 'none';
  if (ph) ph.style.display = 'none';
  if (img) { img.src = dataUrl; img.style.display = 'block'; }
  const btn = $('btn-capture');
  if (btn) { btn.textContent = '🔄'; btn.title = 'Ulang'; btn.onclick = retakePhoto; }
}

function retakePhoto() {
  state.capturedDataUrl = null;
  const img = $('preview-img');
  if (img) img.style.display = 'none';
  const btn = $('btn-capture');
  if (btn) { btn.textContent = '📷'; btn.title = ''; btn.onclick = captureOrActivate; }
  startCamera();
}

async function savePhoto() {
  if (!state.capturedDataUrl) { toast('Ambil foto terlebih dahulu!'); return; }
  const btn = $('btn-save');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Menyimpan...';

  try {
    // Perkecil gambar dulu agar upload cepat (foto galeri HP bisa belasan MB)
    const imageData = await compressImage(state.capturedDataUrl, 1600, 0.85);
    const res = await api('/api/foto-pasien', {
      method: 'POST',
      body: {
        kd_pasien:  state.patient.kd_pasien,
        tipe:       getChipVal('tipe-chips') || 'sebelum',
        area:       getChipVal('area-chips') || 'wajah',
        tanggal:    $('inp-tgl')?.value || todayLocal(),
        id_rm:      $('inp-rm')?.value || null,
        keterangan: $('inp-ket')?.value || '',
        image_data: imageData,
      }
    });
    if (res.ok) {
      toast('Foto berhasil disimpan!');
      stopCamera();
      await loadAndRenderPatient();
      goBack('scr-patient');
    } else {
      toast('Gagal: ' + (res.msg||'Coba lagi'));
      btn.disabled = false; btn.textContent = 'Simpan Foto';
    }
  } catch(e) {
    toast('Error: ' + e.message);
    btn.disabled = false; btn.textContent = 'Simpan Foto';
  }
}

function closeAdd() {
  stopCamera();
  goBack('scr-patient');
}

// ── SCREEN: DETAIL ────────────────────────────────────────
function openDetail(fid) {
  const f = state.photos.find(x => x.id === fid);
  if (!f) return;
  state.detailPhoto = f;
  renderDetail(f);
  show('scr-detail');
}

function canDeletePhoto(f) {
  const role = state.user?.role || '';
  if (role === 'admin' || role === 'supervisor') return true;
  // Others: only within 24h of upload
  if (f.can_delete !== undefined) return !!f.can_delete;
  if (!f.created_at) return true;
  try {
    const age = (Date.now() - new Date(f.created_at.replace(' ','T')).getTime()) / 3600000;
    return age <= 24;
  } catch { return true; }
}

function renderDetail(f) {
  const tClass = `tipe-${f.tipe}`;
  const canDel = canDeletePhoto(f);
  const s = $('scr-detail');
  s.innerHTML = `
  <div class="hdr">
    <button class="hdr-back" onclick="goBack('scr-patient')">‹</button>
    <div class="hdr-title">Detail Foto</div>
    ${canDel
      ? `<button class="hdr-action" style="background:rgba(239,68,68,.25);border-color:rgba(239,68,68,.5);" onclick="confirmDelete(${f.id})">Hapus</button>`
      : `<span style="font-size:10px;color:rgba(255,255,255,.6);padding:6px 10px;">Hanya admin/supervisor yang dapat menghapus</span>`}
  </div>
  <div class="body">
    <div class="detail-img-wrap">
      <img id="detail-img" src="${f.url}" alt="foto">

      <div class="detail-badge-row">

function getSiblingCompareBtn(f) {

function openEditSheet(fid) {

function confirmDelete(fid) {
  state.pendingDeleteId = fid;
  const overlay = $('modal-delete');
  overlay.innerHTML = `
  <div class="modal-sheet">
    <div class="modal-handle"></div>

async function doDelete() {

// ── SCREEN: COMPARE ───────────────────────────────────────
function openCompare() {
  // Find the most recent before/after pair
  const before = state.photos.filter(f=>f.tipe==='sebelum')[0];
  const after  = state.photos.filter(f=>f.tipe==='sesudah')[0];
  if (!before || !after) { toast('Butuh minimal 1 foto sebelum dan 1 sesudah'); return; }
  openCompareTwo(before.id, after.id);
}

function openCompareTwo(beforeId, afterId) {
  const before = state.photos.find(f=>f.id===beforeId) || state.photos.find(f=>f.tipe==='sebelum');
  const after  = state.photos.find(f=>f.id===afterId)  || state.photos.find(f=>f.tipe==='sesudah');
  if (!before || !after) return;
  state.comparePhotos = { before, after };
  renderCompare(before, after);
  show('scr-compare');
}

function renderCompare(before, after) {
  const s = $('scr-compare');
  s.innerHTML = `
  <div class="hdr">
    <button class="hdr-back" onclick="goBack('scr-patient')">‹</button>
    <div class="hdr-title">Perbandingan Before/After</div>
  </div>
  <div class="compare-labels">
    <div class="compare-label before">Sebelum</div>
    <div class="compare-label after">Sesudah</div>
  </div>
  <div class="compare-outer" id="cmp-outer" style="flex:1;">
    <img class="compare-img" id="cmp-after" src="${after.url}" alt="sesudah">
    <div class="compare-clip" id="cmp-clip" style="width:50%;">
      <img id="cmp-before" src="${before.url}" alt="sebelum">
    </div>
    <div class="compare-handle-line" id="cmp-line" style="left:50%;"></div>
    <div class="compare-handle-circle" id="cmp-handle" style="left:50%;">◁▷</div>
    <div class="compare-hint" id="cmp-hint">Geser untuk membandingkan</div>
  </div>
  <div class="compare-dates">
    <div class="compare-date">📅 ${formatDate(before.tanggal)}<br>${before.area||'—'}</div>
    <div class="compare-date">📅 ${formatDate(after.tanggal)}<br>${after.area||'—'}</div>
  </div>
  <div style="padding:14px 16px;background:var(--card);">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <button class="btn-full btn-outline" style="font-size:12px;" onclick="cyclePair('sebelum')">Ganti Sebelum</button>
      <button class="btn-full btn-outline" style="font-size:12px;" onclick="cyclePair('sesudah')">Ganti Sesudah</button>
    </div>
  </div>`;

  requestAnimationFrame(() => initSlider());
}

function initSlider() {
  const outer  = $('cmp-outer');
  const clip   = $('cmp-clip');
  const line   = $('cmp-line');
  const handle = $('cmp-handle');
  const hint   = $('cmp-hint');
  if (!outer || !handle) return;

  // Set clip image width to match container
  const beforeImg = $('cmp-before');
  if (beforeImg) {
    beforeImg.style.width = outer.offsetWidth + 'px';
  }

  let dragging = false;
  function setPos(clientX) {
    const rect = outer.getBoundingClientRect();
    const pct  = Math.max(2, Math.min(98, (clientX - rect.left) / rect.width * 100));
    clip.style.width = pct + '%';
    line.style.left  = pct + '%';
    handle.style.left = pct + '%';
    if (hint) hint.style.display = 'none';
    // Keep before image full-width inside clip
    if (beforeImg) beforeImg.style.width = rect.width + 'px';
  }

  handle.addEventListener('mousedown',  () => dragging = true);
  document.addEventListener('mouseup',  () => dragging = false);
  document.addEventListener('mousemove', e => { if (dragging) setPos(e.clientX); });
  outer.addEventListener('click', e => setPos(e.clientX));

  handle.addEventListener('touchstart',  e => { dragging = true; e.preventDefault(); }, {passive:false});
  document.addEventListener('touchend',  () => dragging = false);
  document.addEventListener('touchmove', e => {
    if (dragging) { setPos(e.touches[0].clientX); e.preventDefault(); }
  }, {passive:false});
}

// Cycle through available before/after photos
let _cycleIdx = { sebelum: 0, sesudah: 0 };
function cyclePair(tipe) {
  const pool = state.photos.filter(f => f.tipe === tipe);
  if (!pool.length) return;
  _cycleIdx[tipe] = (_cycleIdx[tipe] + 1) % pool.length;
  const picked = pool[_cycleIdx[tipe]];
  state.comparePhotos[tipe === 'sebelum' ? 'before' : 'after'] = picked;
  const { before, after } = state.comparePhotos;
  renderCompare(before, after);
}

// ── UTILS ─────────────────────────────────────────────────
function formatDate(d) {
  if (!d) return '—';
  try {
    return new Date(d + 'T00:00:00').toLocaleDateString('id-ID', {day:'numeric',month:'short',year:'numeric'});
  } catch { return d; }
}
function fmtRp(n) {
  return 'Rp ' + (Math.round(parseFloat(n) || 0)).toLocaleString('id-ID');
}

// Kompres / perkecil gambar sebelum upload agar tidak lambat
function compressImage(dataUrl, maxDim = 1600, quality = 0.85) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width >= height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else                 { width  = Math.round(width  * maxDim / height); height = maxDim; }
      }
      const c = document.createElement('canvas');
      c.width = width; c.height = height;
      c.getContext('2d').drawImage(img, 0, 0, width, height);
      try { resolve(c.toDataURL('image/jpeg', quality)); }
      catch { resolve(dataUrl); }
    };
    img.onerror = () => resolve(dataUrl);   // gagal proses → pakai aslinya
    img.src = dataUrl;
  });
}

// ── BOTTOM NAV (perawat/beautician) ───────────────────────
function updateBottomNav() {
  const nav = $('bottom-nav');
  if (!nav) return;
  const active   = document.querySelector('.screen.active')?.id;
  const isHome    = active === 'scr-search' || active === 'scr-komisi';
  const loggedIn  = !!state.token && $('login-overlay')?.classList.contains('hidden');
  nav.style.display = (isHome && loggedIn) ? 'flex' : 'none';
  nav.querySelectorAll('.bn-item').forEach(b =>
    b.classList.toggle('active', b.dataset.scr === active));
}

function navHome(screenId) {
  const current = document.querySelector('.screen.active')?.id;
  if (current === screenId) return;
  if (screenId === 'scr-komisi') renderKomisi();
  else if (screenId === 'scr-search' && !$('scr-search').innerHTML.trim()) renderSearch();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active','prev'));
  $(screenId).classList.add('active');
  updateBottomNav();
}

// ── SCREEN: KOMISI ────────────────────────────────────────
function monthStartISO() {
  const d = new Date();
  return localDate(new Date(d.getFullYear(), d.getMonth(), 1));
}

function renderKomisi() {
  const s  = $('scr-komisi');
  const kd = state.user?.kd_karyawan;
  const dari   = state._komisiDari   || monthStartISO();
  const sampai = state._komisiSampai || todayLocal();
  state._komisiDari = dari; state._komisiSampai = sampai;

  s.innerHTML = `
  <div class="hdr">
    <div style="flex:1;">
      <div class="hdr-title">💰 Komisi Saya</div>
      <div class="hdr-sub">${state.user?.nama || 'Rachel Clinic'}</div>
    </div>
    <button class="hdr-action" onclick="doMobileLogout()" style="font-size:11px;opacity:.85">Keluar</button>
  </div>
  <div class="body" style="padding-bottom:calc(80px + var(--safe-bot));">
    ${ kd ? `
    <div class="komisi-filter">
      <div style="display:flex;gap:8px;">
        <div style="flex:1;">
          <div class="form-label">Dari</div>
          <input type="date" class="form-input" id="k-dari" value="${dari}">
        </div>
        <div style="flex:1;">
          <div class="form-label">Sampai</div>
          <input type="date" class="form-input" id="k-sampai" value="${sampai}">
        </div>
      </div>
      <button class="btn-full btn-pink" style="margin-top:12px;" onclick="loadKomisi()">Lihat Komisi</button>
    </div>
    <div id="komisi-result"></div>
    ` : `
    <div class="empty-state" style="padding-top:60px;">
      <div class="icon">🔒</div>
      <div class="msg">Akun Anda belum terhubung ke data karyawan.<br>Hubungi admin untuk menautkan.</div>
    </div>` }
  </div>`;

  if (kd) loadKomisi();
}

async function loadKomisi() {
  const kd = state.user?.kd_karyawan;
  if (!kd) return;
  const dari   = $('k-dari')?.value   || state._komisiDari;
  const sampai = $('k-sampai')?.value || state._komisiSampai;
  state._komisiDari = dari; state._komisiSampai = sampai;
  const box = $('komisi-result');
  if (box) box.innerHTML = `<div class="empty-state" style="padding-top:30px;"><div class="icon">⏳</div><div class="msg">Memuat...</div></div>`;
  const rows = await api(`/api/laporan/komisi-detail/${encodeURIComponent(kd)}?dari=${dari}&sampai=${sampai}`) || [];
  renderKomisiResult(Array.isArray(rows) ? rows : []);
}

function renderKomisiResult(rows) {
  const box = $('komisi-result');
  if (!box) return;
  const total = rows.reduce((s,r) => s + (parseFloat(r.komisi) || 0), 0);

  if (!rows.length) {
    box.innerHTML = `
    <div class="komisi-summary">
      <div class="ks-label">Total Komisi</div>
      <div class="ks-value">${fmtRp(0)}</div>
      <div class="ks-sub">0 transaksi</div>
    </div>
    <div class="empty-state" style="padding-top:24px;">
      <div class="icon">📭</div><div class="msg">Belum ada komisi pada rentang ini.</div>
    </div>`;
    return;
  }

  const grouped = {};
  rows.forEach(r => { (grouped[r.tanggal] = grouped[r.tanggal] || []).push(r); });
  const dates = Object.keys(grouped).sort().reverse();

  let html = `
  <div class="komisi-summary">
    <div class="ks-label">Total Komisi</div>
    <div class="ks-value">${fmtRp(total)}</div>
    <div class="ks-sub">${rows.length} transaksi · ${dates.length} hari</div>
  </div>`;

  dates.forEach(d => {
    const dayTotal = grouped[d].reduce((s,r) => s + (parseFloat(r.komisi)||0), 0);
    html += `<div class="komisi-day"><span>${formatDate(d)}</span><span>${fmtRp(dayTotal)}</span></div>`;
    grouped[d].forEach(r => {
      html += `
      <div class="komisi-item">
        <div style="flex:1;min-width:0;">
          <div class="ki-jasa">${r.nm_pelayanan || '—'}</div>
          <div class="ki-meta">${r.nm_pasien || r.kd_pasien || '—'}${r.no_faktur ? ' · '+r.no_faktur : ''}</div>
        </div>
        <div class="ki-komisi">${fmtRp(r.komisi)}</div>
      </div>`;
    });
  });
  box.innerHTML = html;
}

// Close modal on backdrop click
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) closeModal(); });
});

// ── AUTH ──────────────────────────────────────────────────
async function doMobileLogin() {
  const u = $('l-user')?.value?.trim();
  const p = $('l-pass')?.value;
  const errEl = $('login-err');
  if (!u || !p) { if(errEl) errEl.textContent='Username dan password wajib'; return; }
  if(errEl) errEl.textContent='';
  try {
    const res = await api('/api/login', {method:'POST', body:{username:u, password:p}});
    if (res.ok && res.token) {
      const role = res.user?.role;
      if (role !== 'perawat' && role !== 'beautician') {
        if(errEl) errEl.textContent = 'Akses halaman ini hanya untuk perawat / beautician';
        await api('/api/logout', {method:'POST'}).catch(()=>{});
        return;
      }
      state.user  = res.user;
      state.token = res.token;
      saveSession(res.user, res.token);
      $('login-overlay')?.classList.add('hidden');
      renderSearch();
    } else {
      if(errEl) errEl.textContent = res.msg || 'Login gagal';
    }
  } catch(e) {
    if(errEl) errEl.textContent = 'Tidak dapat terhubung ke server';
  }
}

function doMobileLogout() {
  if (state.token) api('/api/logout', {method:'POST'}).catch(()=>{});
  state.user = null;
  state.token = null;
  clearSession();
  stopCamera();
  $('login-overlay')?.classList.remove('hidden');
  // Reset app to search screen
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active','prev'));
  $('scr-search')?.classList.add('active');
  updateBottomNav();
}

// Enter on password field triggers login
document.addEventListener('DOMContentLoaded', () => {
  $('l-pass')?.addEventListener('keydown', e => { if(e.key==='Enter') doMobileLogin(); });
  $('l-user')?.addEventListener('keydown', e => { if(e.key==='Enter') $('l-pass')?.focus(); });
});

// ── INIT ──────────────────────────────────────────────────
// Try restore saved session
const _saved = loadSession();
if (_saved?.token && _saved?.user) {
  state.user  = _saved.user;
  state.token = _saved.token;
  $('login-overlay')?.classList.add('hidden');
  renderSearch();
}
// If no session, login overlay stays visible (no renderSearch call)
</script>
